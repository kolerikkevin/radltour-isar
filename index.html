<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Radltour — ein Tag an der Isar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚲</text></svg>">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  /* Der Rahmen wird so breit, dass Bild + Leiste immer ins Fenster passen —
     das Canvas hat 480×300, also Seitenverhältnis 1.6. */
  :root{ --ui:64px; --pad:28px; }
  html,body{height:100%}
  body{
    background:#07090c;color:#e8ecdf;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
    display:flex;align-items:flex-start;justify-content:center;padding:14px;
    -webkit-font-smoothing:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none;
  }
  #frame{
    width:100%;position:relative;
    max-width:960px;
    max-width:min(960px, calc((100vh  - var(--ui) - var(--pad)) * 1.6));
    max-width:min(960px, calc((100dvh - var(--ui) - var(--pad)) * 1.6));
  }
  canvas{
    display:block;width:100%;height:auto;
    image-rendering:pixelated;image-rendering:crisp-edges;
    background:#0b0d14;border:2px solid #1e2a1c;cursor:pointer;
    touch-action:none;user-select:none;
  }
  #ui{background:#0b0f0b;border:2px solid #1e2a1c;border-top:none;padding:9px 12px 11px}
  #hint{color:#7d9370;font-size:11px;letter-spacing:.6px;text-transform:uppercase;min-height:14px}
  #bar{display:flex;gap:10px;align-items:center;margin-top:9px;padding-top:8px;
       border-top:1px solid #1e2a1c;font-size:11px;color:#7d9370;letter-spacing:.5px}
  #bar b{color:#e8ecdf;font-weight:normal}
  button{background:none;border:1px solid #2c3d28;color:#7d9370;font:inherit;font-size:11px;
         padding:3px 9px;cursor:pointer;letter-spacing:.5px}
  button:hover{color:#ffe066;border-color:#5a5a2a}
  #mute{margin-left:auto}
  #heft{position:absolute;inset:0;background:rgba(8,10,8,.95);display:none;
        flex-direction:column;padding:14px;overflow:hidden;z-index:6}
  #heft.on{display:flex}
  #heft h2{font-size:15px;color:#e8d9a8;letter-spacing:1px;margin-bottom:2px;font-weight:normal}
  #heft .sub{font-size:11px;color:#7d9370;margin-bottom:10px}
  #heftlist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
            display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:5px 14px;align-content:start}
  .grp{grid-column:1/-1;font-size:11px;color:#5f7a55;letter-spacing:1.4px;text-transform:uppercase;
       margin-top:8px;border-bottom:1px solid #1e2a1c;padding-bottom:3px}
  .it{font-size:12px;line-height:1.5;color:#3f4a3a;padding:1px 0}
  .it.got{color:#dfe8d2}
  .it.got .f{display:block;color:#7d9370;font-size:10.5px;line-height:1.35;padding-bottom:3px}
  .it .dot{color:#5a7a4a}
  #heftclose{align-self:flex-start;margin-top:10px}
  /* Der Titelvorhang liegt exakt über dem Bild, nicht über der Leiste */
  #stage{position:relative;line-height:0}
  #veil{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
        flex-direction:column;background:rgba(6,9,6,.55);z-index:5;cursor:pointer;
        text-align:center;padding:4% 5%;line-height:normal}
  #veil.on{display:flex}
  #veil h1{font-size:clamp(15px,5.4vw,26px);letter-spacing:2px;color:#ffe9a8;
           text-shadow:2px 2px 0 #14200f;font-weight:normal}
  #veil p{font-size:clamp(8.5px,2.6vw,12.5px);color:#d8e6c8;line-height:1.65;
          margin-top:clamp(5px,1.6vw,12px);max-width:34em;text-shadow:1px 1px 0 #0d160a}
  #veil .go{margin-top:clamp(7px,2.2vw,18px);border:1px solid #6a7a4a;color:#ffe066;
            padding:clamp(5px,1.4vw,8px) clamp(12px,3.4vw,18px);
            font-size:clamp(9px,2.5vw,12px);letter-spacing:1.2px;background:rgba(8,14,8,.6)}
  /* Handy: kein Rand, kompakte Leiste, größere Tippflächen */
  @media (max-width:700px){
    :root{ --ui:54px; --pad:0px; }
    body{padding:0;align-items:center}
    canvas{border-left:none;border-right:none}
    #ui{border-left:none;border-right:none;padding:6px 9px 8px}
    #hint{font-size:9.5px;letter-spacing:.3px;min-height:12px}
    #bar{font-size:10px;gap:8px;margin-top:6px;padding-top:6px;flex-wrap:nowrap}
    button{padding:5px 10px;font-size:10px}
    #heftlist{grid-template-columns:1fr}
    #heft{padding:11px}
    #veil .go{padding:9px 20px}
  }
  /* Querformat am Handy: die Höhe ist knapp, Leiste noch flacher */
  @media (max-height:460px) and (orientation:landscape){
    :root{ --ui:44px; --pad:0px; }
    body{padding:0;align-items:center}
    #ui{padding:4px 9px 5px}
    #hint{display:none}
    #bar{margin-top:0;padding-top:0;border-top:none}
  }
</style>
</head>
<body>
<div id="frame">
  <div id="stage">
    <canvas id="cv" width="480" height="300"></canvas>
    <div id="veil" class="on">
      <h1>RADLTOUR</h1>
      <p>Ein Tag an der Isar.<br>
         Streif im Vorbeifahren, was am Wegrand steht — wie tief du dich lehnst,<br>
         entscheidet, was deine Hand erwischt.<br>
         Nichts kann schiefgehen.</p>
      <div class="go">losfahren</div>
    </div>
  </div>
  <div id="ui">
    <div id="hint">← → lehnen und die Hand ausstrecken · ↑ ↓ Tempo · am Handy: ziehen</div>
    <div id="bar">
      <span>Heftchen <b id="cnt">0</b>/<b id="tot">0</b></span>
      <span>Begleitung <b id="foll">0</b></span>
      <button id="heftbtn">Heftchen</button>
      <button id="mute">Ton an</button>
    </div>
  </div>
  <div id="heft">
    <h2>Mein Heftchen</h2>
    <div class="sub" id="heftsub"></div>
    <div id="heftlist"></div>
    <button id="heftclose">zurück</button>
  </div>
</div>

/* ============================ Pixel-Werkzeug ============================= */
/* Alles wird auf ganze Pixel gerundet — keine weichen Vektorkanten.        */
function R(x,y,w,h,c){
  x=Math.round(x); y=Math.round(y); w=Math.round(w); h=Math.round(h);
  if(w<=0||h<=0) return;
  ctx.fillStyle=c; ctx.fillRect(x,y,w,h);
}
/* Ellipse als Scanline-Rechtecke → harte Pixelkante */
function oval(cx,cy,rx,ry,c){
  rx=Math.max(0.5,rx); ry=Math.max(0.5,ry);
  if(rx>240||ry>240) return;
  ctx.fillStyle=c;
  const y0=Math.round(cy-ry), y1=Math.round(cy+ry);
  for(let y=y0;y<=y1;y++){
    const t=(y+0.5-cy)/ry, s=1-t*t;
    if(s<=0) continue;
    const w=Math.round(rx*Math.sqrt(s));
    if(w<=0) continue;
    ctx.fillRect(Math.round(cx)-w,y,w*2,1);
  }
}
/* Dither-Muster: 4×4-Bayer, „level" von 0 (nichts) bis 16 (voll) */
const BAYER=[0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];
const DCACHE=new Map();
function ditherPat(col,level){
  level=Math.max(0,Math.min(16,Math.round(level)));
  const key=col+'|'+level;
  let p=DCACHE.get(key);
  if(p) return p;
  const c=document.createElement('canvas'); c.width=4; c.height=4;
  const g=c.getContext('2d'); g.fillStyle=col;
  for(let i=0;i<16;i++) if(BAYER[i]<level) g.fillRect(i%4,(i/4)|0,1,1);
  p=ctx.createPattern(c,'repeat'); DCACHE.set(key,p); return p;
}
/* Vertikaler Verlauf mit Dithering zwischen den Stufen */
function ditherGrad(x,y,w,h,cols){
  const bands=cols.length-1, bh=h/bands;
  for(let b=0;b<bands;b++){
    const y0=y+b*bh;
    R(x,y0,w,Math.ceil(bh)+1,cols[b]);
    const steps=4;
    for(let s=1;s<=steps;s++){
      const sy=y0+bh*(s-1)/steps;
      ctx.fillStyle=ditherPat(cols[b+1],(s/steps)*13);
      ctx.fillRect(Math.round(x),Math.round(sy),Math.round(w),Math.ceil(bh/steps)+1);
    }
  }
}
function hex2rgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
const lerp=(a,b,p)=>a+(b-a)*p;
function mix(a,b,p){
  const A=hex2rgb(a),B=hex2rgb(b);
  const r=Math.round(lerp(A[0],B[0],p)),g=Math.round(lerp(A[1],B[1],p)),bl=Math.round(lerp(A[2],B[2],p));
  return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
}
const shade=(c,p)=>mix(c,'#141a24',p);   // Schatten laufen ins Blaue (SCUMM-Trick)
const light=(c,p)=>mix(c,'#fff6d8',p);   // Licht läuft ins Warme

/* ================================ Ton ==================================== */
const SND={on:true,ac:null,master:null,wind:null,windF:null,windG:null};
function audioInit(){
  if(SND.ac) return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  SND.ac=new AC();
  SND.master=SND.ac.createGain(); SND.master.gain.value=0.9; SND.master.connect(SND.ac.destination);
  const len=SND.ac.sampleRate*2, buf=SND.ac.createBuffer(1,len,SND.ac.sampleRate), d=buf.getChannelData(0);
  let lastN=0;
  for(let i=0;i<len;i++){ const wn=Math.random()*2-1; lastN=(lastN+0.03*wn)/1.03; d[i]=lastN*3.2; }
  SND.wind=SND.ac.createBufferSource(); SND.wind.buffer=buf; SND.wind.loop=true;
  SND.windF=SND.ac.createBiquadFilter(); SND.windF.type='lowpass'; SND.windF.frequency.value=500;
  SND.windG=SND.ac.createGain(); SND.windG.gain.value=0;
  SND.wind.connect(SND.windF); SND.windF.connect(SND.windG); SND.windG.connect(SND.master);

}
function ac(){ if(!SND.on) return null; audioInit();
  if(SND.ac&&SND.ac.state==='suspended') SND.ac.resume(); return SND.ac; }
function tone(freq,dur,type,vol,delay,glide){
  const a=ac(); if(!a) return;
  const t0=a.currentTime+(delay||0);
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  if(glide) o.frequency.exponentialRampToValueAtTime(glide,t0+dur);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol||0.08,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(SND.master); o.start(t0); o.stop(t0+dur+0.05);
}
function noiseBurst(dur,f0,f1,vol,type){
  const a=ac(); if(!a) return;
  const len=Math.max(1,Math.floor(a.sampleRate*dur));
  const buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource(); s.buffer=buf;
  const f=a.createBiquadFilter(); f.type=type||'bandpass'; f.Q.value=1.1;
  f.frequency.setValueAtTime(f0,a.currentTime);
  f.frequency.exponentialRampToValueAtTime(f1,a.currentTime+dur);
  const g=a.createGain(); g.gain.value=vol||0.12;
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  s.connect(f); f.connect(g); g.connect(SND.master); s.start();
}

  for(let n=0;n<leave;n++) addSegment(easeIO(curve,0,n/leave),  easeIO(sY,eY,(enter+hold+n)/tot));

function project(p,camX,camY,camZ){
  p.camera.x=(p.world.x||0)-camX;
  p.camera.y=(p.world.y||0)-camY;
  p.camera.z=(p.world.z||0)-camZ;
  p.screen.scale=CAMD/p.camera.z;
  p.screen.x=Math.round(W/2 + p.screen.scale*p.camera.x*W/2);
  p.screen.y=Math.round(H/2 - p.screen.scale*p.camera.y*H/2);
  p.screen.w=Math.round(p.screen.scale*ROADW*W/2);
}

function palAt(ch,nextCh,blend){
  const a=PAL[ch], b=PAL[nextCh||ch];
  if(!nextCh||blend<=0) return a;
  const m=(x,y)=>mix(x,y,blend);
  return {
    sky:[m(a.sky[0],b.sky[0]),m(a.sky[1],b.sky[1]),m(a.sky[2],b.sky[2]),m(a.sky[3],b.sky[3])],
    fog:m(a.fog,b.fog), fogD:lerp(a.fogD,b.fogD,blend),
    road:[m(a.road[0],b.road[0]),m(a.road[1],b.road[1])],
    rum :[m(a.rum[0], b.rum[0]), m(a.rum[1], b.rum[1])],
    grass:[m(a.grass[0],b.grass[0]),m(a.grass[1],b.grass[1])],
    lane:a.lane||b.lane,
    hills:a.hills&&b.hills?m(a.hills,b.hills):(blend>0.5?b.hills:a.hills),
    tint:blend>0.5?b.tint:a.tint
  };
}

/* zwei Parallax-Ebenen: ferne Hügel, näherer Baumsaum */
function silhouette(yBase,h,col,offset,step,seedOff){
  ctx.fillStyle=col;
  let s=seedOff;
  const rr=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  const pts=[];
  for(let x=-step;x<W+step*2;x+=step) pts.push(rr());
  ctx.beginPath(); ctx.moveTo(-step,yBase+h);
  let i=0;
  for(let x=-step;x<W+step*2;x+=step,i++){
    const px=Math.round(x-((offset%step)+step)%step);
    ctx.lineTo(px, Math.round(yBase - pts[i]*h));
  }
  ctx.lineTo(W+step*2,yBase+h); ctx.closePath(); ctx.fill();
}

/* ============================= Straßenstück ============================== */
function quad(x1,y1,w1,x2,y2,w2,col){
  ctx.fillStyle=col; ctx.beginPath();
  ctx.moveTo(x1-w1,y1); ctx.lineTo(x2-w2,y2); ctx.lineTo(x2+w2,y2); ctx.lineTo(x1+w1,y1);
  ctx.closePath(); ctx.fill();
}
function quadPat(x1,y1,w1,x2,y2,w2,pat){
  ctx.fillStyle=pat; ctx.beginPath();
  ctx.moveTo(x1-w1,y1); ctx.lineTo(x2-w2,y2); ctx.lineTo(x2+w2,y2); ctx.lineTo(x1+w1,y1);
  ctx.closePath(); ctx.fill();
}
function renderSegment(seg,pal){
  const p1=seg.p1.screen, p2=seg.p2.screen, d=seg.dark?0:1;
  const r1=p1.w*0.30, r2=p2.w*0.30;
  quad(0,p1.y,W*2, 0,p2.y,W*2, pal.grass[d]);                       // Wiese
  if(seg.ch==='isar'){                                              // Wasser links
    const wx1=p1.x-p1.w*3.2, wx2=p2.x-p2.w*3.2;
    ctx.fillStyle=d?'#5aa6c8':'#4f9cbe'; ctx.beginPath();
    ctx.moveTo(-W,p1.y); ctx.lineTo(-W,p2.y); ctx.lineTo(wx2,p2.y); ctx.lineTo(wx1,p1.y);
    ctx.closePath(); ctx.fill();
    if(seg.index%7===0){                                            // Glitzern
      ctx.fillStyle='rgba(232,250,255,0.7)';
      ctx.fillRect(Math.round(wx1-14-((seg.index*13)%50)),Math.round(p1.y),6,1);
    }
  }
  quad(p1.x,p1.y,p1.w+r1, p2.x,p2.y,p2.w+r2, pal.rum[d]);           // Bankett
  // gedithertes Übergangsband Bankett→Weg
  quadPat(p1.x,p1.y,p1.w+r1*0.45, p2.x,p2.y,p2.w+r2*0.45, ditherPat(pal.road[d],8));
  quad(p1.x,p1.y,p1.w, p2.x,p2.y,p2.w, pal.road[d]);                // Weg
  if(pal.lane && d===1) quad(p1.x,p1.y,p1.w*0.045, p2.x,p2.y,p2.w*0.045, pal.lane);
  if(seg.gravel>0.3 && d===0)                                       // Kiestextur
    quadPat(p1.x,p1.y,p1.w, p2.x,p2.y,p2.w, ditherPat(light(pal.road[0],0.22),4));
  if(seg.puddle){
    const px1=p1.x+p1.w*seg.puddle.x, w=p1.w*seg.puddle.r;
    oval(px1,p1.y,w,Math.max(1,w*0.20),'#8fc8e0');
    oval(px1-w*0.22,p1.y-w*0.03,w*0.42,Math.max(1,w*0.07),'#e2f4fb');
  }
  if(seg.fog<1){                                                    // Tiefennebel
    ctx.globalAlpha=1-seg.fog; ctx.fillStyle=pal.fog;
    ctx.fillRect(0,Math.round(p2.y),W,Math.round(p1.y-p2.y)+1);

/* ================================ Sprites ================================ */
function drawSpriteObj(seg,sp,pal){
  const sc=seg.p1.screen.scale; if(sc<=0) return;
  const u=sc*ROADW*W/2;
  // Zu weit weg — oder so nah, dass ein einzelnes Objekt das Bild zukleistert.
  if(u<0.5||u>(sp.type==='sp'?76:110)) return;
  const x=seg.p1.screen.x+u*sp.offset;
  const y=seg.p1.screen.y-(sp.h?u*sp.h:0);
  if(seg.p1.screen.y>seg.clip+2) return;
  if(x<-180||x>W+180) return;
  const fog=seg.fog; if(fog<0.04) return;
  ctx.globalAlpha=Math.min(1,fog);
  const bob=Math.sin(G.t*1.6+sp.bob)*u*0.02;
  // Noch nicht im Heftchen? Dann glimmt es schon von weitem — das gibt ein Ziel.
  if(sp.type==='sp'&&!sp.got&&!FOUND.has(sp.sp.n)&&u>3){
    const pu=0.5+0.5*Math.sin(G.t*4+sp.bob);
    ctx.globalAlpha=Math.min(1,fog)*(0.22+pu*0.30);
    oval(x,y-u*(sp.h?0:0.5),u*0.55,u*0.5,'#fff3b0');
    ctx.globalAlpha=Math.min(1,fog);
  }
  switch(sp.type){
    case 'car':    spCar(x,y,u,sp.col); break;
    case 'pillar': spPillar(x,y,u); break;
    case 'lamp':   spLamp(x,y,u); break;
    case 'hedge':  spHedge(x,y,u); break;
    case 'house':  spHouse(x,y,u,sp.seed); break;
    case 'bin':    spBin(x,y,u); break;
    case 'reed':   spReed(x,y,u,sp.bob); break;
    case 'stone':  spStone(x,y,u,sp.seed); break;
    case 'fern':   spFern(x,y,u,sp.bob); break;
    case 'bgtree': spBgTree(x,y,u,sp.col,sp.tall,sp.seed); break;
    case 'sp':     spNature(x,y+bob,u,sp); break;
  }
  ctx.globalAlpha=1;
}

/* Laubkrone: geclusterte Ballen in drei Tönen, mit unruhiger Silhouette —
   runde Blobs sehen nach Vektor aus, Kerben und Ausbuchtungen nach Laub. */
function canopy(x,y,r,col,sd){
  const dk=shade(col,0.42), hi=light(col,0.28), md=col;
  oval(x,y,r,r*0.84,dk);
  oval(x-r*0.20,y-r*0.16,r*0.78,r*0.68,md);
  oval(x+r*0.44,y-r*0.04,r*0.40,r*0.36,md);
  oval(x-r*0.30,y-r*0.32,r*0.44,r*0.38,hi);
  oval(x+r*0.06,y-r*0.40,r*0.30,r*0.24,hi);
  oval(x+r*0.14,y+r*0.36,r*0.42,r*0.28,dk);
  // unruhiger Rand: ein paar Büschel greifen über die Kontur hinaus
  let s=(sd*10000)|0;
  const rr=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  for(let i=0;i<5;i++){
    const a=rr()*6.283, rad=r*(0.82+rr()*0.26);
    oval(x+Math.cos(a)*rad, y+Math.sin(a)*rad*0.8, r*(0.14+rr()*0.14), r*(0.11+rr()*0.11),
         Math.sin(a)<-0.1?hi:(Math.sin(a)>0.4?dk:md));
  }
}

/* Die Begleitung zieht seitlich mit — in einer lockeren V-Formation,
   damit sie Kevin nie verdeckt. Jede Reihe hängt dem Lenken etwas nach. */
function drawFollowers(){
  const n=Math.min(G.followers.length,8);
  for(let i=n-1;i>=0;i--){
    const f=G.followers[i], S=f.sp;
    const row=Math.floor(i/2), sgn=(i%2===0)?-1:1;
    const hi=Math.min(G.hist.length-1,(row+1)*9);
    const hx=G.hist.length?G.hist[hi]:0;
    const sc=0.60-row*0.06;
    const x=W/2+hx*9*sc+sgn*(34+row*13);
    const y=H-58-row*11;
    const bob=Math.sin(G.t*4.2+i*1.7)*2.4;
    ctx.save(); ctx.translate(Math.round(x),Math.round(y+bob)); ctx.scale(sc,sc);
    const dk=shade(S.c,0.34);
    if(S.g==='f'){
      const fl=Math.abs(Math.sin(G.t*8+i));
      oval(-5,0,5*(0.3+fl*0.8),6,S.c); oval(5,0,5*(0.3+fl*0.8),6,S.c2||S.c);
      R(-1,-2,2,6,'#232328');
    } else if(S.g==='v'){
      oval(0,0,9,7,dk); oval(-1,-1,8,6,S.c);
      oval(7,-6,5,4.5,S.c2||S.c); R(11,-7,5,2,'#e8a23a'); R(8,-8,2,2,'#14141a');
    } else {
      oval(0,0,12,7,dk); oval(-1,-1,11,6,S.c);

function addParts(x,y,n,col,spread,up){

                  life:1,col:col,r:1+Math.random()*1.6});
}
function drawParts(dt){
  for(let i=G.parts.length-1;i>=0;i--){

function addLabel(x,y,text,col){

/* Schwung-Anzeige: eine Kette aus Blättern, kein Punktezähler */
function drawChain(){

/* ============================== Berühren ================================= */
function reachLen(){ return Math.min(1.3, Math.max(0,Math.abs(G.playerX)-0.35)*0.9); }
const TOL=0.45;
function touchCheck(fromIdx,toIdx){
  const px=G.playerX, side=px>=0?1:-1, r=reachLen();
  G.hand=r; G.handSide=side;
  if(r<=0.02) return;
  const tip=px+side*r;
  for(let i=fromIdx;i<=toIdx;i++){
    const seg=segments[i%segments.length];
    for(const sp of seg.sprites){
      if(sp.type!=='sp'||sp.got) continue;
      if(Math.sign(sp.offset)!==side) continue;
      if(Math.abs(sp.offset-tip)>TOL) continue;
      grab(sp,seg);
    }
  }
}
function grab(sp,seg){
  sp.got=true;
  const S=sp.sp;
  const u=Math.max(6,seg.p1.screen.scale*ROADW*W/2);
  const sx=Math.max(24,Math.min(W-24,seg.p1.screen.x+u*sp.offset));
  const sy=Math.max(44,seg.p1.screen.y-u*0.5);
  G.brushT=0.24;
  /* Schwung-Kette: jede Berührung innerhalb von 2,6 s hängt sich an.
     Sie ist die Belohnungsschleife — Ton steigt, Bild pulst, Kevin wird schneller. */
  G.chain=(G.chainT>0?G.chain:0)+1;
  G.chainT=2.6;
  G.chainBest=Math.max(G.chainBest,G.chain);
  G.pulse=Math.min(1,0.35+G.chain*0.05);
  G.boost=Math.min(340,G.boost+34);
  sfxChain(G.chain);
  if(!FOUND.has(S.n)){
    FOUND.add(S.n); sfxNew();
    addLabel(sx,sy,S.n,'#fff4c0');
    addParts(sx,sy,16,'#fff0b0',3.2,2.4);
    G.toast={n:S.n,f:S.f,life:4.4};
    document.getElementById('cnt').textContent=FOUND.size;
  } else {
    sfxBrush(); addLabel(sx,sy,S.n,'#dfe8d2'); addParts(sx,sy,7,S.c,2.4,1.6);
  }
  if((S.g==='t'||S.g==='v'||S.g==='f') && !G.followers.some(f=>f.sp.n===S.n)){
    G.followers.push({sp:S});
    document.getElementById('foll').textContent=G.followers.length;
    sfxJoin();
  }
}

const CHTITLE={garage:'Tiefgarage',gate:'',siedl:'Siedlung',isar:'Isarweg',wald:'Der Wald',ziel:'Kugler Alm'};

const AIR=[];

/* ============================= Hauptschleife ============================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  G.t+=dt;
  if(G.running&&!G.done) update(dt);
  render(dt);
  requestAnimationFrame(frame);
}
function update(dt){
  let wish=G.speedWish||0;
  if(keys['ArrowUp']||keys['w']) wish=1;
  if(keys['ArrowDown']||keys['s']) wish=-1;
  const target=(wish>0?lerp(SPEED_CRUISE,SPEED_MAX,wish):lerp(SPEED_CRUISE,SPEED_MIN,-wish))+G.boost;
  G.speed+=(target-G.speed)*Math.min(1,dt*1.6);
  // Schwung läuft aus, wenn nichts mehr kommt
  G.chainT=Math.max(0,G.chainT-dt);
  if(G.chainT<=0&&G.chain>0) G.chain=0;
  G.boost=Math.max(0,G.boost-dt*95);
  G.pulse=Math.max(0,G.pulse-dt*2.2);

  let lean=G.targetLean;
  if(keys['ArrowLeft']||keys['a']) lean=-1;
  if(keys['ArrowRight']||keys['d']) lean=1;
  if(!drag&&!(keys['ArrowLeft']||keys['ArrowRight']||keys['a']||keys['d'])) lean=G.targetLean*0.9;
  G.targetLean=lean;
  G.playerX+=(lean*2.0-G.playerX)*Math.min(1,dt*4.2);

  const segNow=findSeg(G.pos+PLAYERZ);
  G.playerX-=segNow.curve*0.00055*(G.speed/SPEED_CRUISE);
  G.playerX=Math.max(-2.15,Math.min(2.15,G.playerX));
  G.bgX-=segNow.curve*(G.speed/SPEED_CRUISE)*0.9;

  const off=Math.abs(G.playerX);
  let rough=segNow.gravel*0.5;
  if(off>1.0){ rough+=0.5+(off-1)*0.5; G.speed*=1-Math.min(0.5,(off-1)*0.35)*dt; }
  G.shake=lerp(G.shake,rough*(G.speed/SPEED_MAX),Math.min(1,dt*8));

  const before=Math.floor(G.pos/SEGL);
  G.pos+=G.speed*dt;
  const after=Math.floor(G.pos/SEGL);
  if(G.pos>=trackLength-PLAYERZ-SEGL*175&&!G.done) startEnding();

  const pIdx=Math.floor((G.pos+PLAYERZ)/SEGL);
  touchCheck(Math.max(0,pIdx-1),Math.min(segments.length-1,pIdx+1));
  for(let i=before;i<=after;i++){
    const s=segments[Math.max(0,Math.min(segments.length-1,i+Math.floor(PLAYERZ/SEGL)))];
    if(s&&s.puddle&&!s.puddle.hit&&Math.abs(G.playerX-s.puddle.x)<s.puddle.r+0.35){
      s.puddle.hit=true; sfxSplash();
      addParts(W/2+G.playerX*9,H-22,20,'#c6ecf8',5.5,3.2);
      G.shake=Math.max(G.shake,0.5);
    }
  }
  G.brushT=Math.max(0,G.brushT-dt);
  G.hist.unshift(G.playerX); if(G.hist.length>90) G.hist.pop();

  const ch=findSeg(G.pos+PLAYERZ).ch;
  if(ch!==G.chapter){
    G.chapter=ch;
    if(CHTITLE[ch]){ chShown=CHTITLE[ch]; chT=3.4; }
    if(ch==='gate'){ G.flash=1.0; tone(392,1.4,'sine',0.05,0); tone(587,1.6,'sine',0.035,0.12); }
  }
  if(SND.windG){
    const v=G.speed/SPEED_MAX;
    SND.windG.gain.value=0.012+v*0.055+G.shake*0.05;
    SND.windF.frequency.value=380+v*900+G.shake*700;
  }
  ambientBirds(dt);
  G.flash=Math.max(0,G.flash-dt*0.55);
}

function render(dt){
  const baseSeg=findSeg(G.pos), basePct=(G.pos%SEGL)/SEGL;
  const playerSeg=findSeg(G.pos+PLAYERZ), playerPct=((G.pos+PLAYERZ)%SEGL)/SEGL;
  const playerY=lerp(playerSeg.p1.world.y,playerSeg.p2.world.y,playerPct);

  const cur=CHAP.find(c=>baseSeg.index>=c.from&&baseSeg.index<c.to)||CHAP[0];
  const nxt=CHAP[CHAP.indexOf(cur)+1];
  const pal=palAt(cur.name,nxt?nxt.name:null,nxt?Math.max(0,1-(cur.to-baseSeg.index)/60):0);

  const hz=Math.round(H*0.5);
  drawSky(pal,hz);
  drawDistance(pal,hz);

  // Die Strecke ist eine Linie, kein Ring — am Ende wird nicht umgebrochen,
  // sonst stehen plötzlich die Tiefgaragen-Säulen im Biergarten.
  let x=0, dx=-(baseSeg.curve*basePct), maxy=H;
  const lastN=Math.min(DRAW,segments.length-baseSeg.index);
  for(let n=0;n<lastN;n++){
    const seg=segments[baseSeg.index+n];
    seg.fog=Math.max(0,Math.min(1,1-Math.exp(-(1-n/DRAW)*pal.fogD)));
    seg.clip=maxy;
    project(seg.p1,(G.playerX*ROADW)-x,    playerY+CAMH,G.pos);
    project(seg.p2,(G.playerX*ROADW)-x-dx, playerY+CAMH,G.pos);
    x+=dx; dx+=seg.curve;
    if(seg.p1.camera.z<=CAMD||seg.p2.screen.y>=seg.p1.screen.y||seg.p2.screen.y>=maxy) continue;
    renderSegment(seg,pal);
    maxy=seg.p2.screen.y;
  }
  for(let n=lastN-1;n>=4;n--){          // n<4 liegt hinter Kevin — nicht zeichnen
    const seg=segments[baseSeg.index+n];
    for(const sp of seg.sprites) drawSpriteObj(seg,sp,pal);
  }

  godRays();
  drawAir(dt);
  drawFollowers();
  if(!G.done) drawRider();
  foreground();
  drawParts(dt);

  // Farbstimmung des Kapitels
  if(pal.tint){ ctx.fillStyle=pal.tint; ctx.fillRect(0,0,W,H); }
  // Vignette in Stufen (kein weicher Verlauf → pixeliger Look)
  ctx.globalAlpha=0.10; ctx.fillStyle='#0a1408';
  ctx.fillRect(0,0,W,10); ctx.fillRect(0,H-10,W,10); ctx.fillRect(0,0,12,H); ctx.fillRect(W-12,0,12,H);
  ctx.fillRect(0,0,W,4); ctx.fillRect(0,H-4,W,4); ctx.fillRect(0,0,5,H); ctx.fillRect(W-5,0,5,H);
  ctx.globalAlpha=1;

  // Schwung-Puls: das Bild atmet kurz auf, wenn die Kette wächst
  if(G.pulse>0.01){
    ctx.globalAlpha=G.pulse*0.16; ctx.fillStyle='#fff6c8'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  }
  drawLabels(dt);
  drawChain();
  drawChapterTitle(dt);
  drawToast(dt);

  if(G.flash>0){ ctx.globalAlpha=Math.min(1,G.flash); ctx.fillStyle='#fffbe8'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(G.done) renderEnding(dt);
}

function drawBiergarten(t,toOff){

  // Kevin von vorne
  const bx=238, by=196, br=Math.sin(t*1.4)*1.2;
  P(bx-27,by-54+br,54,56,KEV.top);
  P(bx-27,by-54+br, 8,56,KEV.topDk);
  P(bx+19,by-54+br, 8,56,KEV.topHi);
  P(bx-10,by-54+br,20,56,KEV.tee);
  P(bx-10,by-54+br, 4,56,KEV.teeSh);
  c.strokeStyle=KEV.skin; c.lineWidth=9; c.lineCap='round';
  c.beginPath(); c.moveTo(bx-25,by-38+br); c.lineTo(bx-46,by-10); c.stroke();
  c.beginPath(); c.moveTo(bx+25,by-38+br); c.lineTo(bx+44,by-16); c.stroke();
  P(bx-8,by-64+br,16,11,KEV.skin);
  P(bx-8,by-64+br, 5,11,KEV.skinSh);
  P(bx-15,by-88+br,30,26,KEV.skin);
  P(bx-15,by-88+br, 7,26,KEV.skinSh);
  P(bx-17,by-94+br,34,8,KEV.hair);
  P(bx-18,by-102+br,36,10,KEV.cap);
  P(bx-18,by-102+br,36,3,KEV.capHi);
  P(bx-2,by-94+br,22,4,KEV.cap);              // Schirm zur Seite
  P(bx-12,by-81+br,10,7,'#e08a3a'); P(bx+2,by-81+br,10,7,'#e08a3a');  // orange Fassung
  P(bx-2,by-79+br,4,2,'#e08a3a');
  P(bx-11,by-80+br,8,5,'#cfe4ee'); P(bx+3,by-80+br,8,5,'#cfe4ee');    // helle Gläser
  P(bx-9,by-79+br,3,3,'#3a3a46');  P(bx+5,by-79+br,3,3,'#3a3a46');    // Augen dahinter
  P(bx-11,by-80+br,8,1,'#ffffff'); P(bx+3,by-80+br,8,1,'#ffffff');    // Glanzkante
  P(bx-5,by-70+br,10,2,'#a86a58');            // zufriedener Mund
  P(bx-7,by-71+br,2,2,'#a86a58'); P(bx+5,by-71+br,2,2,'#a86a58');
  // Radler
  const gx=bx+56, gy=196;
  P(gx-12,gy-50,24,50,'#efe4c2');
  P(gx-12,gy-32,24,32,'#e8b23a');
  P(gx-12,gy-32,24,3,'#f4cc6a');
  P(gx-12,gy-50,24,9,'#fdfbf2');
  P(gx-12,gy-50, 4,50,'#fffaf0');
  P(gx+8, gy-50, 3,50,'#cfc2a0');
  // Begleitung am Tisch
  for(let i=0;i<Math.min(G.followers.length,7);i++){
    const S=G.followers[i].sp, fx=92+i*40, fy=194;
    if(S.g==='f'){ O(fx-5,fy-9,5,6,S.c); O(fx+5,fy-9,5,6,S.c2||S.c); }
    else if(S.g==='v'){ O(fx,fy-7,8,6,S.c); O(fx+6,fy-13,4.5,4,S.c2||S.c); }
    else { O(fx,fy-7,11,7,S.c); O(fx+9,fy-13,6,5,S.c); if(S.c2) O(fx-8,fy-9,4,3,S.c2); }
  }
  // E-Bike lehnt am Stamm
  c.strokeStyle='#14111d'; c.lineWidth=3;
  c.beginPath(); c.arc(20,236,11,0,7); c.stroke();
  c.beginPath(); c.arc(58,236,11,0,7); c.stroke();
  c.strokeStyle=KEV.bike; c.lineWidth=3;
  c.beginPath(); c.moveTo(20,236); c.lineTo(44,210); c.stroke();
  c.beginPath(); c.moveTo(44,210); c.lineTo(58,236); c.stroke();
  c.beginPath(); c.moveTo(44,210); c.lineTo(32,208); c.stroke();
  /* Vordergrund: die Kante des Nachbartischs schließt das Bild unten */
  P(0,272,W,14,'#a8884a'); P(0,272,W,3,'#c8a86a'); P(0,286,W,H-286,'#7d6438');
  c.globalAlpha=0.25; P(0,268,W,4,'#5c4a24'); c.globalAlpha=1;
  for(let i=0;i<40;i++){                     // Kies im Vordergrund
    const gx=(i*37+13)%W, gy=248+((i*17)%20);
    P(gx,gy,2,1,i%3?'#9db073':'#7e9257');
  }
}
function renderEnding(dt){
  G.endT+=dt;
  const t=G.endT;
  const blur=Math.max(0,Math.min(1,(t-5)/4.2));
  if(blur>0.01){
    drawBiergarten(t,true);
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(off1,0,0);
    ctx.globalAlpha=0.5;
    for(let i=1;i<=3;i++){ const k=blur*i*2.4; ctx.drawImage(off1,-k,-k,W+k*2,H+k*2); }
    ctx.globalAlpha=1; ctx.imageSmoothingEnabled=false;
  } else drawBiergarten(t,false);

  ctx.globalAlpha=Math.min(0.45,blur*0.5); ctx.fillStyle='#f0c878'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;

  ctx.textAlign='center';
  if(t<4.6){
    ctx.globalAlpha=Math.min(1,t*0.8)*Math.min(1,(4.6-t)*1.2);
    ctx.font='bold 13px ui-monospace, Menlo, monospace';
    ctx.fillStyle='rgba(255,250,230,0.8)'; ctx.fillText('Kugler Alm. Hier wurde das Radler erfunden.',W/2+1,63);
    ctx.fillStyle='#3a2a14'; ctx.fillText('Kugler Alm. Hier wurde das Radler erfunden.',W/2,62);
    ctx.globalAlpha=1;
  } else if(t<9.2){
    ctx.globalAlpha=Math.min(1,(t-4.8)*0.9)*Math.min(1,(9.2-t)*1.2);
    ctx.font='bold 13px ui-monospace, Menlo, monospace'; ctx.fillStyle='#3a2a14';
    ctx.fillText('Noch eins.',W/2,62);
    ctx.globalAlpha=1;
  }
  ctx.textAlign='left';

  const lid=Math.max(0,Math.min(1,(t-9.2)/3.4));
  if(lid>0){
    const e=lid*lid*(3-2*lid), top=H*0.56*e, bot=H*0.56*e;
    ctx.fillStyle='#0b0806';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(W,0); ctx.lineTo(W,top);
    ctx.quadraticCurveTo(W/2,top+22*e,0,top); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(W,H); ctx.lineTo(W,H-bot);
    ctx.quadraticCurveTo(W/2,H-bot-22*e,0,H-bot); ctx.closePath(); ctx.fill();
  }
  if(t>12.6){
    const a=Math.min(1,(t-12.6)/1.4);
    ctx.globalAlpha=a; ctx.fillStyle='#0b0806'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.font='bold 15px ui-monospace, Menlo, monospace'; ctx.fillStyle='#e8d9a8';
    ctx.fillText('Feierabend.',W/2,96);
    ctx.font='11px ui-monospace, Menlo, monospace'; ctx.fillStyle='#cfe0bd';
    ctx.fillText(FOUND.size+' von '+SPECIES.length+' Arten im Heftchen',W/2,124);
    ctx.fillText(G.followers.length+' sind dir gefolgt',W/2,142);
    ctx.font='10px ui-monospace, Menlo, monospace'; ctx.fillStyle='#7d9370';
    ctx.fillText('Heftchen unten öffnen · zum Neustart klicken',W/2,176);
    ctx.textAlign='left'; ctx.globalAlpha=1;
    if(!G.endDone){ G.endDone=true;
      document.getElementById('hint').textContent='Angekommen. Heftchen ansehen — oder ins Bild klicken für eine neue Runde.'; }
  }
}
cv.addEventListener('click',()=>{ if(G.done&&G.endT>13.6) location.reload(); });

/* ================================ Heftchen =============================== */
const GRP={b:'Bäume',p:'Pflanzen',t:'Tiere',v:'Vögel',f:'Falter'};
function openHeft(){
  const list=document.getElementById('heftlist'); list.innerHTML='';
  for(const g of ['b','p','t','v','f']){
    const items=SPECIES.filter(s=>s.g===g);
    const have=items.filter(s=>FOUND.has(s.n)).length;
    const h=document.createElement('div'); h.className='grp';
    h.textContent=GRP[g]+' — '+have+'/'+items.length; list.appendChild(h);
    for(const s of items){
      const d=document.createElement('div'), got=FOUND.has(s.n);
      d.className='it'+(got?' got':'');
      d.innerHTML=got ? '<span class="dot">◆</span> '+s.n+'<span class="f">'+s.f+'</span>'
                      : '<span class="dot">◇</span> ?????';
      list.appendChild(d);
    }
  }
  document.getElementById('heftsub').textContent=FOUND.size+' von '+SPECIES.length+' Arten — alles gibt es wirklich in Oberbayern.';
  document.getElementById('heft').classList.add('on');
}
function closeHeft(){ document.getElementById('heft').classList.remove('on'); }
document.getElementById('heftbtn').onclick=openHeft;
document.getElementById('heftclose').onclick=closeHeft;
document.getElementById('mute').onclick=function(){
  SND.on=!SND.on; this.textContent=SND.on?'Ton an':'Ton aus';
  if(!SND.on&&SND.windG) SND.windG.gain.value=0;
  if(SND.on) ac();
};

document.getElementById('hint').textContent = TOUCH
  ? 'ziehen: seitlich lehnen · hoch/runter = tempo'
  : '← → oder ziehen: lehnen · ↑ ↓: tempo';

document.querySelector('#veil p').innerHTML=
  'Ein Tag an der Isar.<br>Lehn dich zur Seite und streif im Vorbeifahren, was am Wegrand steht.<br>'+
  'Wie weit du dich lehnst, entscheidet, was deine Hand erwischt.<br>Nichts kann schiefgehen.';

const veil=document.getElementById('veil');
veil.addEventListener('click',()=>{
  veil.classList.remove('on'); ac();
  G.running=true; G.speed=SPEED_MIN;
  chShown=CHTITLE.garage; chT=3.4;
});
requestAnimationFrame(frame);
